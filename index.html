<!DOCTYPE html>
<html>
<head>
  <title>Writing Companion</title>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial; max-width: 800px; margin: auto; padding: 20px;">

<h1>✍️ Writing Companion</h1>

<p>
Write 2–3 sentences about your dream holiday.
Describe the destination and explain why you would like to visit it.
</p>
<textarea id="studentText" rows="8" style="width:100%;"></textarea>

<br><br>

<button onclick="getFeedback()">✨ Get Writing Feedback</button>
<h2>Feedback</h2>

<div id="feedback">
Your feedback will appear here.
</div>

<script>
function getFeedback() {

    const text =
      document.getElementById("studentText").value;

    let feedback = "";

    if (text.length < 20) {

        feedback =
`Grammar:
Try writing a longer response.

Vocabulary:
Add more details about the destination.

Improved Version:
I would like to visit Tokyo because I enjoy shopping and trying delicious food.`;

    } else {

        feedback =
`Grammar:
Remember to check your sentence structure and verb forms.

Vocabulary:
Try using descriptive words such as exciting, beautiful, delicious, or relaxing.

Improved Version:
I would like to visit Tokyo because I enjoy shopping, trying delicious food, and exploring the exciting city.`;
    }

    document.getElementById("feedback").innerHTML =
      feedback.replace(/\n/g, "<br>");
}
</script>

</body>
</html>
