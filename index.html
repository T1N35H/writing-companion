<!DOCTYPE html>
<html>
<head>
  <title>Writing Companion</title>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial; max-width: 800px; margin: auto; padding: 20px;">

<h1>✍️ Writing Companion</h1>

<p>Write 2–3 sentences about your dream holiday.</p>

<textarea id="studentText" rows="8" style="width:100%;"></textarea>

<br><br>

<button onclick="getFeedback()">Get Feedback</button>

<h2>Feedback</h2>

<div id="feedback">
Your feedback will appear here.
</div>

<script>
async function getFeedback() {

    const text =
      document.getElementById("studentText").value;

    document.getElementById("feedback").innerHTML =
      "Generating feedback...";

    const response = await fetch(
      "https://script.google.com/macros/s/AKfycbwjUCgq7tfxJER3iu_8PVdkO-BBIyRl_jL3S59wT6b9cjt-VUIP2dle4tLobfOxqtsu/exec",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          text: text
        })
      }
    );

    const data = await response.json();

    document.getElementById("feedback").innerHTML =
      data.feedback.replace(/\n/g, "<br>");
}
</script>

</body>
</html>
